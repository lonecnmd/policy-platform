<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数字深圳投资政策导航平台</title>
  <meta name="description" content="按资金类别和资金渠道梳理数字深圳投资政策，支持检索、解读、条款摘录和文件下载。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-main">
      <div>
        <div class="eyebrow">数字深圳投资政策导航</div>
        <h1>资金渠道政策知识平台</h1>
        <p>按四大资金类别、八类资金渠道组织政策文件，覆盖政府投资、中央预算内投资、超长期特别国债、专项资金、专项债券、政策性金融、基础设施REITs和社会投资等方向。</p>
      </div>
      <div class="hero-actions">
        <a class="ghost-btn" href="#cardsView">浏览政策解读</a>
        <a class="primary-btn" href="#filesView">查看文件附件</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="side-title">资金层级导航</div>
      <div id="navTree"></div>
    </aside>

    <section class="content">
      <section class="toolbar" aria-label="筛选工具栏">
        <label>
          资金类别
          <select id="categoryFilter"></select>
        </label>
        <label>
          资金渠道
          <select id="channelFilter"></select>
        </label>
        <label>
          标签
          <select id="tagFilter"></select>
        </label>
        <label class="search-wrap">
          搜索
          <input id="searchInput" type="search" placeholder="搜索政策名称、渠道、摘要、条款" />
        </label>
        <button id="resetBtn" type="button">重置</button>
      </section>

      <section class="flow-band" aria-label="资金政策理解路径">
        <div class="flow-title">查看路径</div>
        <div class="flow">
          <span>资金类别</span>
          <b></b>
          <span>资金渠道</span>
          <b></b>
          <span>政策文件</span>
          <b></b>
          <span>简要解读</span>
          <b></b>
          <span>条款摘录</span>
          <b></b>
          <span>下载原文</span>
        </div>
      </section>

      <section class="tabs" aria-label="视图切换">
        <button class="tab active" data-view="cards" type="button">政策卡片</button>
        <button class="tab" data-view="matrix" type="button">渠道矩阵</button>
        <button class="tab" data-view="files" type="button">文件下载</button>
        <span id="resultCount"></span>
      </section>

      <section id="cardsView" class="policy-list"></section>
      <section id="matrixView" class="matrix-view hidden"></section>
      <section id="filesView" class="files-view hidden"></section>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

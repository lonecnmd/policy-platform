<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数字深圳项目管理政策分析平台</title>
  <meta name="description" content="按投资管理、预算管理、采购管理和资产管理四个维度，梳理国家、广东省、深圳市三级项目管理政策文件。" />
  <link rel="stylesheet" href="styles.css?v=20260821-2" />
</head>
<body>
  <header class="hero">
    <div class="hero-main">
      <div>
        <div class="eyebrow">数字深圳项目管理政策分析</div>
        <h1>四维度政策知识平台</h1>
        <p>围绕投资管理、预算管理、采购管理和资产管理四个维度，梳理国家、广东省、深圳市三级政策文件，并保留投资决策、资金安排、监督评价、预算、采购、资产等制度主题之间的交叉归属。</p>
      </div>
      <div class="hero-actions">
        <a class="ghost-btn" href="#cardsView">浏览政策解读</a>
        <a class="primary-btn" href="#filesView">查看文件附件</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="side-title">四维度导航</div>
      <div id="navTree"></div>
    </aside>

    <section class="content">
      <section class="toolbar" aria-label="筛选工具栏">
        <label>
          管理维度
          <select id="categoryFilter"></select>
        </label>
        <label>
          制度主题
          <select id="channelFilter"></select>
        </label>
        <label>
          政策层级
          <select id="levelFilter"></select>
        </label>
        <label>
          标签
          <select id="tagFilter"></select>
        </label>
        <label class="search-wrap">
          搜索
          <input id="searchInput" type="search" placeholder="搜索政策名称、渠道、摘要、条款" />
        </label>
        <button id="resetBtn" type="button">重置</button>
      </section>
      <div id="activeScope" class="active-scope hidden"></div>

      <section class="flow-band" aria-label="资金政策理解路径">
        <div class="flow-title">分析路径</div>
        <div class="flow">
          <span>管理维度</span>
          <b></b>
          <span>政策层级</span>
          <b></b>
          <span>制度主题</span>
          <b></b>
          <span>政策任务</span>
          <b></b>
          <span>实施流程</span>
          <b></b>
          <span>图谱映射</span>
        </div>
      </section>

      <section class="tabs" aria-label="视图切换">
        <button class="tab active" data-view="cards" type="button">政策卡片</button>
        <button class="tab" data-view="analysis" type="button">政策解读</button>
        <button class="tab" data-view="graph" type="button">图谱框架</button>
        <button class="tab" data-view="matrix" type="button">维度矩阵</button>
        <button class="tab" data-view="files" type="button">文件下载</button>
        <span id="resultCount"></span>
      </section>

      <section id="cardsView" class="policy-list"></section>
      <section id="analysisView" class="analysis-view hidden"></section>
      <section id="graphView" class="graph-view hidden"></section>
      <section id="matrixView" class="matrix-view hidden"></section>
      <section id="filesView" class="files-view hidden"></section>
    </section>
  </main>

  <script src="data.js?v=20260821-2"></script>
  <script src="analysis-data.js?v=20260821-2"></script>
  <script src="app.js?v=20260821-2"></script>
</body>
</html>
